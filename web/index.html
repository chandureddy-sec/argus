<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="same-origin" />
    <!-- Argus has its own light and dark themes: browsers and extensions must not recolour it. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="darkreader-lock" />
    <meta name="theme-color" content="#1b1e26" />
    <!-- Applies the saved theme before the first paint (no flash of the other theme). -->
    <script src="/app/theme-init.js"></script>
    <link rel="icon" href="/app/logo.svg" type="image/svg+xml" />
    <link rel="preload" href="/app/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>Reports · Argus</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
