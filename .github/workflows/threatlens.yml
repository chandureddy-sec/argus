name: Argus CI

on:
  push:
    branches: [main, master]
    paths: ["threatlens/**", "web/**", "deploy/**", ".github/workflows/threatlens.yml"]
  pull_request:
    paths: ["threatlens/**", "web/**", "deploy/**", ".github/workflows/threatlens.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: threatlens

jobs:
  lint-type:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with: { enable-cache: true }
      - run: uv sync --frozen
      - run: uv run ruff check src tests migrations
      - run: uv run ruff format --check src tests migrations
      - run: uv run mypy
      - run: uv run threatlens validate-profile

  test:
    name: Tests (unit + integration)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env: { POSTGRES_USER: threatlens, POSTGRES_PASSWORD: ci-only-password, POSTGRES_DB: threatlens }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U threatlens" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    env:
      TL_DATABASE_URL: postgresql+asyncpg://threatlens:ci-only-password@localhost:5432/threatlens
      TL_REDIS_URL: redis://localhost:6379/0
      TL_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with: { enable-cache: true }
      - run: uv sync --frozen
      - run: uv run pytest --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v7
        with: { name: coverage, path: threatlens/coverage.xml }

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v10.3.0
        with: { enable-cache: true }
      - run: uv sync --frozen
      - name: bandit (SAST)
        run: uv run bandit -c pyproject.toml -r src
      - name: pip-audit (known-vulnerable dependencies)
        run: uv run pip-audit
      - name: semgrep
        run: uvx semgrep scan --config p/python --config p/secrets --error src
      - name: gitleaks (secrets in history)
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  web:
    name: Argus web (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  image:
    name: Image build, scan & SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build --build-context webapp-src=../web -t threatlens:ci .
      - name: Trivy (image vulnerabilities)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: threatlens:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@v0.24.3
        with:
          image: threatlens:ci
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - name: Compose smoke test
        run: |
          printf 'POSTGRES_PASSWORD=ci-only-password\n' > .env
          docker compose up -d --wait
          curl -fsS http://127.0.0.1:8000/readyz
          docker compose down -v
