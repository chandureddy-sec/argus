<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="New product">
  <title>New product (template)</title>
  <defs>
    <!-- 1. Pick the product's gradient: three stops, dark-to-light, bottom-left to top-right. -->
    <linearGradient id="np-g" x1="8" y1="56" x2="56" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffc53d"/>
      <stop offset=".5" stop-color="#ff9f45"/>
      <stop offset="1" stop-color="#ff4f7b"/>
    </linearGradient>
  </defs>
  <!-- 2. Family frame: never change size, radius, fill or stroke width. -->
  <rect x="3" y="3" width="58" height="58" rx="17" fill="#0e0b1d"/>
  <rect x="3" y="3" width="58" height="58" rx="17" fill="none" stroke="url(#np-g)" stroke-width="2.5"/>
  <!-- 3. Product glyph: inside 13..51 on both axes, keep clear of the signal corner (40..56 x 8..24),
          strokes 4.5 (5.5 for one emphasis stroke), round caps, product gradient. -->
  <rect x="13" y="13" width="38" height="38" rx="4" fill="none" stroke="#3a2d66" stroke-width="1" stroke-dasharray="2 3"/>
  <!-- 4. Family signature: the signal. Same place, size and pink on every product. -->
  <circle cx="48" cy="16" r="4" fill="#ff4fa3"/>
</svg>
