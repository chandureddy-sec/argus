<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ThreatLens">
  <title>ThreatLens</title>
  <defs>
    <linearGradient id="tl-g" x1="8" y1="56" x2="56" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff4fa3"/>
      <stop offset=".52" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#2ee6f0"/>
    </linearGradient>
  </defs>
  <!-- family frame -->
  <rect x="3" y="3" width="58" height="58" rx="17" fill="#0e0b1d"/>
  <rect x="3" y="3" width="58" height="58" rx="17" fill="none" stroke="url(#tl-g)" stroke-width="2.5"/>
  <!-- glyph: a lens closing in on a threat -->
