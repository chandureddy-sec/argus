<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="same-origin">
<title>Sign in · ThreatLens</title>
<link rel="icon" href="/ui/static/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/ui/static/app.css?v={{ version }}">
</head>
<body>
<div class="login-wrap">
  <form class="panel login" method="post" action="/ui/login" autocomplete="off">
    <img src="/ui/static/logo.svg" alt="" width="48" height="48">
    <h1>Sign in to ThreatLens</h1>
    <p>Use an API key. Create one with <code>.\tl key yourname analyst</code>.</p>
    {% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}
    <input type="password" name="key" placeholder="tl_…" required maxlength="200" aria-label="API key" autofocus>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="primary" type="submit">Sign in</button>
    <p class="note">The key is checked once and never stored in your browser; you get a 12-hour session.</p>
  </form>
</div>
</body>
</html>
