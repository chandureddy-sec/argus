<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="same-origin">
<title>Sign in · ThreatLens</title>
<link rel="icon" href="/ui/static/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/ui/static/app.css?v={{ version }}">
</head>
<body>
<div class="login-wrap">
  <form class="panel login" method="post" action="/ui/login">
    <img src="/ui/static/logo.svg" alt="" width="48" height="48">
    <h1>Sign in to ThreatLens</h1>
    {% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}
    <label for="username">Username</label>
    <input id="username" type="text" name="username" value="{{ username }}" required maxlength="64" autocomplete="username" autocapitalize="none" spellcheck="false"{% if not username %} autofocus{% endif %}>
    <label for="password">Password</label>
    <input id="password" type="password" name="password" required maxlength="256" autocomplete="current-password"{% if username %} autofocus{% endif %}>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="primary" type="submit">Sign in</button>
    <p class="note">No account? An admin creates one with <code>.	l user NAME ROLE</code>. You stay signed in for 12 hours.</p>
  </form>
</div>
</body>
</html>
