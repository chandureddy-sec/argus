[project]
name = "threatlens"
version = "0.1.0"
description = "Self-hosted threat intelligence platform: collect, score, explain and share open-source threat intelligence."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Chandu Reddy" }]
dependencies = [
    "alembic>=1.20.0",
    "arq>=0.28.0",
    "asyncpg>=0.32.0",
    "cryptography>=46",
    "fastapi>=0.143.0",
    "fpdf2>=2.8",
    "httpx>=0.28.1",
    "jinja2>=3.1.4",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.3",
    "qrcode>=8.2",
    "redis>=5.3.1",
    "sqlalchemy[asyncio]>=2",
    "structlog>=26.1.0",
    "tldextract>=5.4.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
threatlens = "threatlens.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/threatlens"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "A", "C4", "SIM", "RUF", "ASYNC", "PT", "TID"]
ignore = ["S101"] # assert is how pytest works

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["N999"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = ["arq.*", "qrcode.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
  "integration: needs a running Postgres and Redis (TL_DATABASE_URL / TL_REDIS_URL); skipped otherwise",
]

[tool.coverage.run]
source = ["threatlens"]
branch = true
# SQLAlchemy's asyncio layer switches greenlets; without this, code after an
# awaited query is reported as not run.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = ["tests", "migrations"]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "bandit>=1.9.4",
    "hypothesis>=6.168.5",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.10",
    "stix2-validator==3.2.0",
    "taxii2-client>=2.3.0",
    "types-pyyaml>=6.0.12.20260906",
]
