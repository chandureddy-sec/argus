# Organization profile: who "we" are. Validated by `threatlens validate-profile`.
# No secrets belong in this file. Fill in what applies; every list may stay empty.
# Until it is filled in, nothing is treated as "ours" except the assets your
# ReconX scans find (those always count as ours).
#
#   sectors:    [fintech, healthcare, ...]        industries you work in
#   geography:  [IN, US, ...]                     ISO country codes you operate in
#   domains:    [yourcompany.com]                 your registered domains
#   brands:     ["Your Brand"]                    names phishers might imitate
#   ip_ranges:  ["198.51.100.0/24"]               public ranges you own (CIDR)
#   vendors:    [microsoft, fortinet, ...]        vendors whose advisories matter
#   tech_stack:                                   products you run (CPE 2.3)
#     - { product: "FortiGate", cpe: "cpe:2.3:o:fortinet:fortios:*" }
#
# A filled-in example lives in tests/fixtures/example_org_profile.yaml.
org:
  name: "My organisation"
  sectors: []
  geography: []
  domains: []
  brands: []
  ip_ranges: []
  vendors: []
  tech_stack: []
