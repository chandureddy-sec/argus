# ThreatLens development / single-host stack.
#   cp .env.example .env   (then set POSTGRES_PASSWORD)
#   docker compose up -d --build --wait
# Every published port binds to 127.0.0.1 only.
name: threatlens

x-app: &app
  build:
    context: .
    # The Argus front end lives next to this folder (../web); the image builds it.
    additional_contexts:
      webapp-src: ../web
  image: threatlens:dev
  env_file: .env
  environment:
    TL_DATABASE_URL: postgresql+asyncpg://threatlens:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/threatlens
    TL_REDIS_URL: redis://redis:6379/0
    TL_RECONX_URL: http://reconx:8787
    # API worker processes; uvicorn reads it, the others ignore it. One worker serves about
    # 100 cached lookups/s, two about 210 (docs/PERFORMANCE.md).
    WEB_CONCURRENCY: ${TL_API_WORKERS:-2}
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: threatlens
      POSTGRES_DB: threatlens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    # Host port is overridable via TL_DB_PORT (default 5432) for machines
    # that already run Postgres on 5432. The container always listens on 5432;
    # the api, worker and migrate services address it by DNS name 'db:5432'.
    ports: ["127.0.0.1:${TL_DB_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threatlens -d threatlens"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    # Host port is overridable via TL_REDIS_PORT (default 6379). Containers
    # always talk to 'redis:6379' on the compose network.
    ports: ["127.0.0.1:${TL_REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    healthcheck: { disable: true }
    depends_on:
      db: { condition: service_healthy }

  api:
    <<: *app
    # Host port is overridable via TL_API_PORT (default 8000). The browser,
    # curl and start.sh's readiness probe all read the same variable.
    ports: ["127.0.0.1:${TL_API_PORT:-8000}:8000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 10s
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  # The ReconX engine (Argus attack-surface scans). Internal only: no published port.
  reconx:
    build:
      context: ..
      dockerfile: deploy/reconx.Dockerfile
    image: argus-reconx:dev
    volumes: [recondata:/data]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped

  worker:
    <<: *app
    command: ["arq", "threatlens.worker.WorkerSettings"]
    environment:
      TL_DATABASE_URL: postgresql+asyncpg://threatlens:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/threatlens
      TL_REDIS_URL: redis://redis:6379/0
      TL_RECONX_URL: http://reconx:8787
      TL_DATA_DIR: /app/data
    volumes: [rawdata:/app/data]  # the only writable path besides /tmp
    restart: unless-stopped
    # Healthy while the worker's heartbeat (written at start-up and every 5 min) is fresh.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time,redis; v=redis.Redis.from_url(os.environ['TL_REDIS_URL']).get('threatlens:worker:heartbeat'); raise SystemExit(0 if v and time.time()-int(v) < 600 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  rawdata:
  recondata:  # ReconX reports, monitors, drift DB and keys
